name: Keep calculator awake (Streamlit Community Cloud only)

# Delete this workflow once the calculator moves to PythonAnywhere / a VPS.
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/keepalive.py
        env:
          APP_URL: ${{ vars.APP_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: keepalive-failure
          path: keepalive_failure.png
