name: Keep calculator awake (Streamlit Community Cloud only)

# Opens the calculator in a real browser every 8 hours so Streamlit Community Cloud never sees
# 12 hours without a visit. Delete this workflow once the calculator moves to PythonAnywhere / a VPS.
# Run it by hand any time: Actions > this workflow > Run workflow.
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/keepalive.py
        env:
          APP_URL: ${{ vars.APP_URL }}
      - name: Save what the browser saw (only exists if the check failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-screenshot
          path: keepalive_failure.png
          if-no-files-found: ignore



